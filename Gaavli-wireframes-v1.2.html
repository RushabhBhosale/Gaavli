<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Farmer-Buyer Connect — Full Wireframe Set v1.1</title>
<style>
  :root{
    --ink:#1f2328; --ink-soft:#5b6168; --line:#b9bec4; --line-soft:#dde1e4;
    --bg:#f3f4f5; --panel:#ffffff; --accent:#2f6f4f; --accent-soft:#e4ede8;
    --faded:#c7cbce; --warn:#b5651d; --warn-bg:#fdf3ea; --bad:#a13c34; --bad-bg:#f8eceb;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Segoe UI',Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);}
  .app{display:flex;min-height:100vh;}
  .sidebar{width:230px;background:var(--panel);border-right:1px solid var(--line-soft);padding:20px 0;flex-shrink:0;}
  .brand{font-size:14px;font-weight:700;letter-spacing:.02em;padding:0 20px 18px;border-bottom:1px solid var(--line-soft);margin-bottom:10px;}
  .brand small{display:block;font-weight:400;color:var(--ink-soft);margin-top:2px;font-size:11px;}
  .role-tab{display:flex;align-items:center;gap:10px;padding:12px 20px;cursor:pointer;font-size:13.5px;color:var(--ink-soft);border-left:3px solid transparent;}
  .role-tab .dot{width:8px;height:8px;border-radius:50%;background:var(--line);}
  .role-tab.active{color:var(--ink);font-weight:600;border-left-color:var(--accent);background:var(--accent-soft);}
  .role-tab.active .dot{background:var(--accent);}
  .role-tab:hover{background:#f7f8f8;}
  .role-note{padding:14px 20px;font-size:11.5px;color:var(--ink-soft);line-height:1.5;border-top:1px solid var(--line-soft);margin-top:10px;}
  .main{flex:1;display:flex;flex-direction:column;min-width:0;}
  .screen-tabs{display:flex;gap:6px;flex-wrap:wrap;padding:16px 24px;border-bottom:1px solid var(--line-soft);background:var(--panel);}
  .screen-tab{font-size:12px;padding:6px 12px;border:1px solid var(--line-soft);border-radius:14px;cursor:pointer;color:var(--ink-soft);background:#fafbfb;white-space:nowrap;}
  .screen-tab.active{background:var(--ink);color:#fff;border-color:var(--ink);}
  .stage{flex:1;display:flex;gap:28px;padding:28px;overflow:auto;align-items:flex-start;justify-content:center;}
  .canvas-col{display:flex;flex-direction:column;align-items:center;gap:10px;flex-shrink:0;}
  .canvas-title{font-size:12px;color:var(--ink-soft);}
  .notes-col{width:310px;flex-shrink:0;background:var(--panel);border:1px solid var(--line-soft);border-radius:8px;padding:18px 20px;}
  .notes-col h4{margin:0 0 10px;font-size:12.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);}
  .notes-col ul{margin:0 0 16px;padding-left:16px;font-size:13px;line-height:1.55;}
  .notes-col ul:last-child{margin-bottom:0;}
  .nav-list b{color:var(--accent);}
  .phone{width:320px;background:#fff;border:2px solid var(--ink);border-radius:26px;padding:10px 8px;box-shadow:0 6px 18px rgba(0,0,0,.08);}
  .phone-screen{border:1px solid var(--line-soft);border-radius:16px;min-height:620px;overflow:hidden;display:flex;flex-direction:column;background:#fff;}
  .statusbar{height:18px;background:#eee;display:flex;align-items:center;justify-content:space-between;padding:0 10px;font-size:9px;color:#888;}
  .browser{width:800px;border:1px solid var(--ink);border-radius:10px;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.08);}
  .browser-bar{background:#e9eaeb;padding:8px 12px;display:flex;gap:6px;align-items:center;}
  .browser-bar .dot{width:8px;height:8px;border-radius:50%;background:#c6c9cb;}
  .browser-url{flex:1;background:#fff;border:1px solid var(--line-soft);border-radius:4px;font-size:10px;color:var(--ink-soft);padding:3px 8px;margin-left:6px;}
  .browser-body{min-height:600px;background:#fff;}
  .wf-topbar{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line-soft);}
  .wf-back{width:20px;height:20px;border:1px solid var(--line);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--ink-soft);}
  .wf-topbar-title{font-weight:700;font-size:14.5px;flex:1;}
  .wf-icon{width:22px;height:22px;border:1px solid var(--line);border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--ink-soft);}
  .wf-addbtn{font-size:11px;font-weight:600;padding:6px 12px;border-radius:6px;background:var(--ink);color:#fff;}
  .wf-body{padding:14px;flex:1;overflow:auto;position:relative;}
  .wf-search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;color:var(--ink-soft);margin-bottom:10px;}
  .wf-search .mic{margin-left:auto;width:20px;height:20px;border:1px solid var(--line);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;flex-shrink:0;}
  .wf-listheader{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap;}
  .wf-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
  .wf-chip{font-size:10.5px;padding:5px 10px;border:1px solid var(--line);border-radius:12px;color:var(--ink-soft);}
  .wf-chip.active{background:var(--ink);color:#fff;border-color:var(--ink);}
  .wf-section-title{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);margin:16px 0 8px;}
  .wf-section-title:first-child{margin-top:0;}
  .wf-statrow{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
  .wf-stat{flex:1;min-width:90px;border:1px dashed var(--line);border-radius:8px;padding:10px 8px;text-align:center;}
  .wf-stat.clickable{cursor:pointer;}
  .wf-stat.clickable:hover{border-color:var(--ink);background:#fafbfb;}
  .wf-stat .v{font-size:17px;font-weight:700;}
  .wf-stat .l{font-size:9.5px;color:var(--ink-soft);margin-top:2px;}
  .wf-stat .ct{font-size:8.5px;color:var(--accent);margin-top:3px;}
  .wf-card{border:1px solid var(--line-soft);border-radius:8px;padding:10px;display:flex;gap:10px;margin-bottom:8px;position:relative;}
  .wf-card.faded{opacity:.42;}
  .wf-card.selectable{border-width:1.5px;}
  .wf-card.selected{border-color:var(--accent);background:var(--accent-soft);}
  .wf-thumb{width:44px;height:44px;border-radius:6px;flex-shrink:0;background:repeating-linear-gradient(45deg,#eceeef,#eceeef 4px,#f6f7f7 4px,#f6f7f7 8px);border:1px solid var(--line-soft);}
  .wf-card-main{flex:1;min-width:0;}
  .wf-card-title{font-size:12.5px;font-weight:600;}
  .wf-card-sub{font-size:11px;color:var(--ink-soft);margin-top:2px;}
  .wf-card-meta{font-size:10px;color:var(--ink-soft);margin-top:4px;}
  .wf-badge{position:absolute;top:8px;right:8px;font-size:8.5px;padding:2px 6px;border-radius:8px;background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent);}
  .wf-badge.grey{background:#eee;color:var(--ink-soft);border-color:var(--line);}
  .wf-badge.warn{background:var(--warn-bg);color:var(--warn);border-color:var(--warn);}
  .wf-field{margin-bottom:12px;}
  .wf-field label{display:block;font-size:10.5px;color:var(--ink-soft);margin-bottom:4px;}
  .wf-field label .req{color:var(--bad);}
  .wf-field .hint{font-size:10px;color:var(--ink-soft);margin-top:4px;}
  .wf-input{border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:12px;color:var(--ink);}
  .wf-input.ph{color:var(--ink-soft);}
  .wf-input.errbox{border-color:var(--bad);background:var(--bad-bg);}
  .wf-fielderror{display:flex;align-items:center;gap:4px;color:var(--bad);font-size:10.5px;margin-top:4px;}
  .wf-formerror{border:1px solid var(--bad);background:var(--bad-bg);color:var(--bad);border-radius:6px;padding:9px 11px;font-size:11px;margin-bottom:12px;}
  .wf-select{display:flex;justify-content:space-between;align-items:center;}
  .wf-select .car{color:var(--ink-soft);font-size:10px;}
  .wf-photo-upload{border:1px dashed var(--line);border-radius:8px;height:56px;display:flex;align-items:center;justify-content:center;font-size:10.5px;color:var(--ink-soft);}
  .wf-toggle2{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;font-size:11px;margin-bottom:14px;}
  .wf-toggle2 div{flex:1;text-align:center;padding:8px;color:var(--ink-soft);}
  .wf-toggle2 div.active{background:var(--ink);color:#fff;font-weight:600;}
  .wf-button{display:inline-flex;align-items:center;justify-content:center;padding:10px 16px;border-radius:8px;font-size:12.5px;font-weight:600;width:100%;margin-bottom:8px;}
  .wf-button.primary{background:var(--ink);color:#fff;}
  .wf-button.secondary{background:#fff;color:var(--ink);border:1px solid var(--ink);}
  .wf-button.ghost{background:transparent;color:var(--ink-soft);border:1px dashed var(--line);}
  .wf-button.danger{background:#fff;color:var(--bad);border:1px solid var(--bad);}
  .wf-button.small{width:auto;padding:6px 12px;font-size:11px;margin:0;}
  .wf-buttonrow{display:flex;gap:8px;flex-wrap:wrap;}
  .wf-buttonrow .wf-button{margin-bottom:0;}
  .wf-fab{position:absolute;bottom:70px;right:16px;width:44px;height:44px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:300;box-shadow:0 3px 8px rgba(0,0,0,.25);}
  .wf-notif{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line-soft);}
  .wf-notif .nd{width:7px;height:7px;border-radius:50%;background:var(--accent);margin-top:5px;flex-shrink:0;}
  .wf-notif.read .nd{background:transparent;}
  .wf-notif-title{font-size:12px;font-weight:600;}
  .wf-notif-sub{font-size:11px;color:var(--ink-soft);margin-top:2px;}
  .wf-notif-time{font-size:9.5px;color:var(--faded);margin-top:3px;}
  .wf-banner{border:1px solid var(--line-soft);background:#fafbfa;border-radius:8px;padding:11px;font-size:11.5px;color:var(--ink-soft);margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .wf-banner.accentb{border-color:var(--accent);background:var(--accent-soft);color:var(--ink);}
  .wf-coordcard{display:flex;align-items:center;gap:10px;border:1px solid var(--line-soft);border-radius:8px;padding:9px 11px;margin-bottom:12px;font-size:11px;color:var(--ink-soft);}
  .wf-coordcard b{color:var(--ink);}
  .wf-bottomnav{display:flex;border-top:1px solid var(--line-soft);}
  .wf-bottomnav div{flex:1;text-align:center;padding:8px 4px;font-size:9px;color:var(--ink-soft);}
  .wf-bottomnav div.active{color:var(--ink);font-weight:700;}
  .wf-bottomnav .ic{width:16px;height:16px;border:1px solid var(--line);border-radius:4px;margin:0 auto 3px;}
  .wf-bottomnav div.active .ic{border-color:var(--ink);background:var(--accent-soft);}
  .wf-table{width:100%;border-collapse:collapse;font-size:11px;}
  .wf-table th{text-align:left;font-size:9.5px;text-transform:uppercase;color:var(--ink-soft);border-bottom:1px solid var(--line);padding:7px 8px;white-space:nowrap;}
  .wf-table td{padding:8px;border-bottom:1px solid var(--line-soft);}
  .wf-table tr:hover td{background:#fafbfb;}
  .wf-pill{font-size:9.5px;padding:2px 8px;border-radius:8px;}
  .wf-pill.ok{background:#e4ede8;color:var(--accent);}
  .wf-pill.pending{background:#f4ecdf;color:var(--warn);}
  .wf-pill.bad{background:#f3e3e2;color:var(--bad);}
  .wf-pagination{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:11px;color:var(--ink-soft);}
  .wf-pagenums{display:flex;gap:4px;}
  .wf-pagenums span{width:22px;height:22px;border:1px solid var(--line-soft);border-radius:5px;display:flex;align-items:center;justify-content:center;}
  .wf-pagenums span.cur{background:var(--ink);color:#fff;border-color:var(--ink);}
  .wf-dependency{border:1px solid var(--warn);background:var(--warn-bg);border-radius:8px;padding:12px 14px;margin-bottom:12px;}
  .wf-dependency-title{font-weight:700;font-size:12px;margin-bottom:7px;color:var(--warn);}
  .wf-dependency ul{margin:0 0 9px;padding-left:16px;font-size:11px;line-height:1.6;color:var(--ink);}
  .wf-otp{display:flex;gap:8px;margin-bottom:10px;}
  .wf-otp div{width:34px;height:40px;border:1px solid var(--line);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:14px;}
  .wf-text{font-size:12px;color:var(--ink-soft);line-height:1.5;margin-bottom:12px;}
  .wf-divider{border-top:1px solid var(--line-soft);margin:14px 0;}
  .wf-avatar{width:52px;height:52px;border-radius:50%;background:var(--accent-soft);border:1px solid var(--accent);display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--accent);font-weight:700;margin:0 auto 10px;}
  .wf-center{text-align:center;}
  .wf-switchrow{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line-soft);}
  .wf-switchrow .sw-t{font-size:12px;font-weight:600;}
  .wf-switchrow .sw-s{font-size:10px;color:var(--ink-soft);margin-top:2px;}
  .wf-switch{width:34px;height:18px;border-radius:10px;position:relative;flex-shrink:0;}
  .wf-switch.on{background:var(--accent);}
  .wf-switch.off{background:#ddd;}
  .wf-switch i{width:14px;height:14px;border-radius:50%;background:#fff;position:absolute;top:2px;}
  .wf-switch.on i{left:18px;}
  .wf-switch.off i{left:2px;}
  .wf-formcard{border:1px solid var(--line-soft);border-radius:8px;padding:16px;}
  .wf-suggest{border:1px solid var(--line-soft);border-radius:6px;margin-top:-6px;margin-bottom:10px;overflow:hidden;}
  .wf-suggest div{padding:7px 10px;font-size:11px;border-bottom:1px solid var(--line-soft);color:var(--ink-soft);}
  .wf-suggest div:last-child{border-bottom:none;}
  .wf-suggest div.hi{color:var(--ink);font-weight:600;background:#fafbfb;}
</style>
</head>
<body>
<div class="app">
  <div class="sidebar" id="sidebar">
    <div class="brand">Farmer–Buyer Connect<small>Full wireframe set — v1.1</small></div>
    <div id="roleTabs"></div>
    <div class="role-note" id="roleNote"></div>
  </div>
  <div class="main">
    <div class="screen-tabs" id="screenTabs"></div>
    <div class="stage" id="stage"></div>
  </div>
</div>

<script>
function el(type, comp){
  switch(type){
    case 'topbar':
      return '<div class="wf-topbar">' + (comp.back?'<div class="wf-back">‹</div>':'') + '<div class="wf-topbar-title">' + comp.title + '</div>' + (comp.addLabel?('<div class="wf-addbtn">'+comp.addLabel+'</div>'):'') + (comp.actions||[]).map(function(a){return '<div class="wf-icon">'+a+'</div>';}).join('') + '</div>';
    case 'search':
      return '<div class="wf-search"><span>🔍</span><span>' + comp.placeholder + '</span>' + (comp.mic?'<div class="mic">🎤</div>':'') + '</div>';
    case 'listheader':
      return '<div class="wf-listheader"><div class="wf-search" style="margin-bottom:0;flex:1;"><span>🔍</span><span>'+comp.placeholder+'</span></div>'+(comp.addLabel?('<div class="wf-addbtn">'+comp.addLabel+'</div>'):'')+'</div>';
    case 'chips':
      return '<div class="wf-chips">' + comp.items.map(function(c){return '<div class="wf-chip '+(c.active?'active':'')+'">'+c.label+'</div>';}).join('') + '</div>';
    case 'sectiontitle':
      return '<div class="wf-section-title">' + comp.text + '</div>';
    case 'statrow':
      return '<div class="wf-statrow">' + comp.stats.map(function(s){return '<div class="wf-stat '+(s.clickTo?'clickable':'')+'"><div class="v">'+s.value+'</div><div class="l">'+s.label+'</div>'+(s.clickTo?('<div class="ct">→ '+s.clickTo+'</div>'):'')+'</div>';}).join('') + '</div>';
    case 'card': return renderCard(comp);
    case 'cardlist': return comp.items.map(renderCard).join('');
    case 'field': return renderField(comp);
    case 'formerror': return '<div class="wf-formerror">⚠ ' + comp.text + '</div>';
    case 'suggest': return '<div class="wf-suggest">' + comp.items.map(function(s,i){return '<div class="'+(i===0?'hi':'')+'">'+s+'</div>';}).join('') + '</div>';
    case 'photoupload': return '<div class="wf-field"><label>'+(comp.label||'Photo (optional)')+'</label><div class="wf-photo-upload">+ Add photo</div></div>';
    case 'switchrow': return '<div class="wf-switchrow"><div><div class="sw-t">'+comp.label+'</div>'+(comp.sub?('<div class="sw-s">'+comp.sub+'</div>'):'')+'</div><div class="wf-switch '+(comp.on?'on':'off')+'"><i></i></div></div>';
    case 'button': return '<div class="wf-button '+(comp.style||'primary')+'">'+comp.label+'</div>';
    case 'buttonrow': return '<div class="wf-buttonrow">' + comp.buttons.map(function(b){return '<div class="wf-button '+(b.style||'secondary')+'">'+b.label+'</div>';}).join('') + '</div>';
    case 'fab': return '<div class="wf-fab">'+(comp.label||'+')+'</div>';
    case 'notiflist': return comp.items.map(function(n){return '<div class="wf-notif '+(n.read?'read':'')+'"><div class="nd"></div><div><div class="wf-notif-title">'+n.title+'</div><div class="wf-notif-sub">'+n.sub+'</div><div class="wf-notif-time">'+n.time+'</div></div></div>';}).join('');
    case 'banner': return '<div class="wf-banner '+(comp.accent?'accentb':'')+'"><span>'+comp.text+'</span>'+(comp.cta?('<div class="wf-button small '+(comp.style||'secondary')+'">'+comp.cta+'</div>'):'')+'</div>';
    case 'coordcard': return '<div class="wf-coordcard">👤 <span>Your village coordinator: <b>'+comp.name+'</b> · tap to view</span></div>';
    case 'toggle2': return '<div class="wf-toggle2"><div class="'+(comp.active===0?'active':'')+'">'+comp.a+'</div><div class="'+(comp.active===1?'active':'')+'">'+comp.b+'</div></div>';
    case 'otp': return '<div class="wf-otp">' + '0000'.split('').map(function(){return '<div>•</div>';}).join('') + '</div>';
    case 'text': return '<div class="wf-text">' + comp.value + '</div>';
    case 'divider': return '<div class="wf-divider"></div>';
    case 'avatar': return '<div class="wf-avatar">' + comp.initials + '</div>';
    case 'center': return '<div class="wf-center">' + (comp.items||[]).map(function(c){return el(c.type,c);}).join('') + '</div>';
    case 'table': return '<table class="wf-table"><thead><tr>' + comp.columns.map(function(c){return '<th>'+c+' '+(c.sortable!==false?'↕':'')+'</th>';}).join('') + '</tr></thead><tbody>' + comp.rows.map(function(r){return '<tr>'+r.map(function(cell){return '<td>'+cell+'</td>';}).join('')+'</tr>';}).join('') + '</tbody></table>';
    case 'pagination': return '<div class="wf-pagination"><span>Showing '+comp.showing+' of '+comp.total+'</span><div class="wf-pagenums"><span>‹</span>'+(comp.pages||[1,2,3]).map(function(p){return '<span class="'+(p===comp.current?'cur':'')+'">'+p+'</span>';}).join('')+'<span>…</span><span>›</span></div></div>';
    case 'dependency': return '<div class="wf-dependency"><div class="wf-dependency-title">'+comp.title+'</div><ul>'+comp.items.map(function(i){return '<li>'+i+'</li>';}).join('')+'</ul><div class="wf-buttonrow">'+(comp.buttons||[]).map(function(b){return '<div class="wf-button '+(b.style||'secondary')+'">'+b.label+'</div>';}).join('')+'</div></div>';
    case 'formcard': return '<div class="wf-formcard">' + (comp.items||[]).map(function(c){return el(c.type,c);}).join('') + '</div>';
    default: return '';
  }
}
function renderCard(c){
  return '<div class="wf-card '+(c.faded?'faded':'')+' '+(c.selectable?'selectable':'')+' '+(c.selected?'selected':'')+'">'+
    (c.badge?('<div class="wf-badge '+(c.badgeStyle||'')+'">'+c.badge+'</div>'):'')+
    (c.image!==false?'<div class="wf-thumb"></div>':'')+
    '<div class="wf-card-main"><div class="wf-card-title">'+c.title+'</div><div class="wf-card-sub">'+(c.sub||'')+'</div>'+(c.meta?('<div class="wf-card-meta">'+c.meta+'</div>'):'')+'</div></div>';
}
function renderField(f){
  var label = f.label + (f.required ? ' <span class="req">*</span>' : '');
  var boxClass = f.error ? 'errbox' : '';
  var errorHtml = f.error ? ('<div class="wf-fielderror">⚠ '+f.error+'</div>') : (f.hint ? ('<div class="hint">'+f.hint+'</div>') : '');
  if(f.type==='select'){
    return '<div class="wf-field"><label>'+label+'</label><div class="wf-input wf-select '+boxClass+'"><span>'+f.value+'</span><span class="car">▾</span></div>'+errorHtml+'</div>';
  }
  return '<div class="wf-field"><label>'+label+'</label><div class="wf-input '+(f.value?'':'ph')+' '+boxClass+'">'+(f.value||f.placeholder||'')+'</div>'+errorHtml+'</div>';
}
function renderScreen(screen){
  var body = screen.components.map(function(c){return el(c.type,c);}).join('');
  var nav = screen.frame==='browser' ? '' : '<div class="wf-bottomnav">'+(screen.bottomnav||[]).map(function(n){return '<div class="'+(n.active?'active':'')+'"><div class="ic"></div>'+n.label+'</div>';}).join('')+'</div>';
  return '<div class="wf-body">'+body+(screen.fab?el('fab',screen.fab):'')+'</div>'+nav;
}

/* ---------------------------------------------------------------
   App wiring
--------------------------------------------------------------- */
var currentRole = 'guest';
var currentScreenIdx = 0;

function buildSidebar(){
  var wrap = document.getElementById('roleTabs');
  var keys = Object.keys(roles);
  wrap.innerHTML = keys.map(function(key){
    var r = roles[key];
    return '<div class="role-tab '+(key===currentRole?'active':'')+'" data-role="'+key+'"><span class="dot"></span>'+r.label+'</div>';
  }).join('');
  var items = wrap.querySelectorAll('.role-tab');
  for(var k=0;k<items.length;k++){
    items[k].addEventListener('click', (function(t){ return function(){ currentRole=t.dataset.role; currentScreenIdx=0; render(); }; })(items[k]));
  }
  document.getElementById('roleNote').textContent = roles[currentRole].note;
}
function buildScreenTabs(){
  var wrap = document.getElementById('screenTabs');
  var screens = roles[currentRole].screens;
  wrap.innerHTML = screens.map(function(s,i){
    return '<div class="screen-tab '+(i===currentScreenIdx?'active':'')+'" data-idx="'+i+'">'+(i+1)+'. '+s.name+'</div>';
  }).join('');
  var items = wrap.querySelectorAll('.screen-tab');
  for(var k=0;k<items.length;k++){
    items[k].addEventListener('click', (function(t){ return function(){ currentScreenIdx=parseInt(t.dataset.idx); render(); }; })(items[k]));
  }
}
function buildStage(){
  var screens = roles[currentRole].screens;
  var screen = screens[currentScreenIdx];
  var stage = document.getElementById('stage');
  var frameHtml = screen.frame==='browser'
    ? '<div class="browser"><div class="browser-bar"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="browser-url">fbconnect.org/admin</div></div><div class="browser-body">'+renderScreen(screen)+'</div></div>'
    : '<div class="phone"><div class="phone-screen"><div class="statusbar"><span>9:41</span><span>●●● 4G</span></div>'+renderScreen(screen)+'</div></div>';
  var notes = (screen.notes||[]).map(function(n){return '<li>'+n+'</li>';}).join('');
  var navnotes = (screen.navnotes||[]).map(function(n){return '<li>'+n+'</li>';}).join('');
  stage.innerHTML =
    '<div class="canvas-col"><div class="canvas-title">'+roles[currentRole].label+' — '+screen.name+'</div>'+frameHtml+'</div>'+
    '<div class="notes-col"><h4>Screen notes</h4><ul>'+(notes||'<li>—</li>')+'</ul><h4>Navigation</h4><ul class="nav-list">'+(navnotes||'<li>—</li>')+'</ul></div>';
}
function render(){ buildSidebar(); buildScreenTabs(); buildStage(); }
render();
</script>
